version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: automation_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: automation_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:latest
    container_name: automation_chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: automation_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/automatax
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=change_me_in_production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CHROMA_URL=http://chromadb:8000
    depends_on:
      - mongodb
      - redis
      - chromadb
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: automation_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb_data:
  chroma_data:
